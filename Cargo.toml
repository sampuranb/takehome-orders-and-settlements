[package]
name = "orders-and-settlements"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared by the native server and the browser WASM bundle.
leptos = "0.8.20"
leptos_router = "0.8.15"
leptos_meta = "0.8.6"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
# Calendar dates and order ids appear in server-function arguments and return
# types, so both crates are shared by the two targets. Their clock and
# random-number features are NOT: `chrono/clock` and `uuid/v7` are switched on
# from the `ssr` list below, because cargo-leptos runs two separate builds and a
# feature named there is only active in the native one.
#
# This is not a style preference. Enabling `uuid/v7` unconditionally fails the
# wasm build outright — uuid refuses to compile for wasm32-unknown-unknown
# without an explicit randomness source — and chrono's default `wasmbind`
# feature would drag wasm-bindgen and js-sys into the bundle for a clock the
# browser never reads. Today is decided on the server.
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
uuid = { version = "1.24.0", default-features = false, features = ["serde"] }

# Server-only (`ssr`). Marked optional so none of it reaches the WASM bundle.
leptos_axum = { version = "0.8.10", optional = true }
axum = { version = "0.8.9", optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal"], optional = true }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    # Teaches SQLx to decode Postgres UUID and DATE columns. Without these the
    # first query that binds a `Uuid` or a `NaiveDate` fails to compile.
    "uuid",
    "chrono",
], optional = true }
# Pinned to 0.6 on purpose: leptos_axum 0.8 and axum 0.8 both depend on
# tower-http ^0.6, so 0.7 would compile a second copy of the crate into the
# dependency graph. 0.7 also returns 406 for `identity;q=0` per RFC 9110.
tower-http = { version = "0.6.11", features = [
    "compression-gzip",
    "compression-br",
    "trace",
], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# One HTTP client for the shared Better Auth service.
#
# `default-features = false` is load-bearing. reqwest 0.13's default `rustls`
# feature selects the aws-lc-rs crypto backend, while sqlx's `tls-rustls`
# resolves to `tls-rustls-ring`. Taking the default would compile *two* crypto
# providers into one binary and leave rustls unable to pick a process default.
# `rustls-no-provider` lets Cargo's feature unification settle on the single
# provider sqlx already enabled: ring.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls-no-provider",
], optional = true }
# Not a second TLS stack: this is the same rustls 0.23 sqlx and reqwest already
# share, named directly only so the process can install ring as *the* crypto
# provider. `rustls-no-provider` above deliberately declines to choose one, and
# reqwest panics at `Client::build` until something does.
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
], optional = true }
# Already in the tree via reqwest's `json` feature; declared explicitly because
# src/auth.rs parses Better Auth's bodies by hand. `get-session` answers `200`
# with a bare `null` for a signed-out visitor, so the body has to be inspected
# before it is deserialized rather than piped straight through `Response::json`.
serde_json = { version = "1.0", optional = true }

# Browser-only (`hydrate`).
wasm-bindgen = { version = "0.2.127", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
# Stands in for the shared Better Auth service so its contract can be tested
# without running Node, including failure modes a live service will not produce
# on demand (outage, malformed body, refreshed cookie).
wiremock = "0.6.5"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }
# `ServiceExt::oneshot`, so `tests/api.rs` can drive the real router in-process
# instead of binding a port. Already in the lock file as a transitive dependency
# of Axum, but a crate is not nameable until it is a direct one.
tower = { version = "0.5.3", features = ["util"] }

[features]
default = []
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook"]
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:sqlx",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:reqwest",
    "dep:rustls",
    "dep:serde_json",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    # Server-only capabilities of two crates that are otherwise shared. See the
    # comment on `chrono` above for why these live here and not up there.
    "chrono/clock",
    "uuid/v7",
]

[package.metadata.leptos]
# Produces target/site/pkg/orders.js, orders.wasm, and orders.css.
output-name = "orders"
site-root = "target/site"
site-pkg-dir = "pkg"
# Port 5174 is not arbitrary: the shared Better Auth service reserves
# http://localhost:5174 for this application in its TRUSTED_ORIGINS, and it
# rejects sign-out from any other origin. Browse to localhost, not 127.0.0.1 —
# they are different origins to both the browser and Better Auth.
site-addr = "127.0.0.1:5174"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
# Plain CSS is read straight through (no Sass toolchain), minified by Lightning
# CSS in release builds, and published at /pkg/<output-name>.css — the href the
# <Stylesheet> tag in src/app.rs uses. `hash-files` stays at its default of
# false, so that href is stable. This key is also what enables CSS hot reload:
# cargo-leptos only watches a stylesheet declared as `style-file`.
style-file = "style/main.css"
# `assets-dir` is still intentionally absent: this application ships no static
# files beyond the generated bundle, and cargo-leptos wipes anything in
# site-root outside pkg/ on each rebuild.

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
