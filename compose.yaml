name: ${COMPOSE_PROJECT_NAME:-takehome-orders}

services:
  auth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Run scripts/setup.sh first}
      POSTGRES_DB: auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [auth-db]

  auth:
    build:
      context: "https://github.com/sampuranb/takehome-suite.git#00478b07258c418d0e03bab2a050e19c7efca77f:services/shared-auth"
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://auth:${AUTH_DB_PASSWORD}@auth-db:5432/auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run scripts/setup.sh first}
      BETTER_AUTH_URL: http://localhost:${AUTH_PORT:-3005}
      TRUSTED_ORIGINS: http://localhost:${AUTH_PORT:-3005},http://localhost:${APP_PORT:-5174}
    ports:
      - "127.0.0.1:${AUTH_PORT:-3005}:3005"
    networks: [edge, auth-db, shared-auth]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/setup.sh first}
      POSTGRES_DB: orders
    volumes:
      - app-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [app-db]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://orders:${APP_DB_PASSWORD}@db:5432/orders
      BETTER_AUTH_URL: http://auth:3005
      RUST_LOG: ${RUST_LOG:-info,orders_and_settlements=info,tower_http=info}
    ports:
      - "127.0.0.1:${APP_PORT:-5174}:8080"
    networks: [edge, app-db, shared-auth]

networks:
  edge:
  shared-auth:
    internal: true
  auth-db:
    internal: true
  app-db:
    internal: true

volumes:
  auth-data:
  app-data:
